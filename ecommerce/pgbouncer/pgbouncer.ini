[databases]
; escrituras -> primaria ; lecturas de catálogo -> réplica
shop    = host=db-primary port=5432 dbname=shop
shop_ro = host=db-replica port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
admin_users = shop
stats_users = shop
ignore_startup_parameters = extra_float_digits
